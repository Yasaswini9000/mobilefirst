# Server
server.port=8086

# H2 (in-memory) — easy for local testing
spring.datasource.url=jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT config (change secret in prod!)
jwt.secret=a-very-long-and-secure-secret-key-for-jwt-with-at-least-256-bits
jwt.expiration-ms=86400000